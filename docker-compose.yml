# Sobe o MySQL usado em desenvolvimento.
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: digital-flavor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-digital_flavor}
      MYSQL_USER: ${DB_USER:-digital_flavor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-digital_flavor}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
