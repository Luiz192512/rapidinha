# Sobe o PostgreSQL usado em desenvolvimento.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: digital-flavor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-digital_flavor}
      POSTGRES_USER: ${DB_USER:-digital_flavor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-digital_flavor}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
